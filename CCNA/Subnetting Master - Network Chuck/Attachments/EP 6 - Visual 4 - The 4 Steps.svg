<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 486" width="1200" height="486"><defs><marker id="a-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ECEEF6"/></marker><marker id="a-hack" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFB020"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#98A0B8"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A57BFF"/></marker></defs><rect x="0" y="0" width="1200" height="486" rx="28" fill="#14161F" stroke="#2B3047" stroke-width="2" /><text x="48" y="72" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="36" fill="#ECEEF6" font-weight="700" text-anchor="start" >The 4 steps</text><text x="48" y="108" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#98A0B8" font-weight="400" text-anchor="start" >Example: split 192.168.1.0/24 into 4 networks</text><rect x="40" y="140" width="262" height="236" rx="18" fill="#1D2030" stroke="#A57BFF" stroke-width="2" /><circle cx="74" cy="176" r="20" fill="#A57BFF"/><text x="74" y="183" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#14161F" font-weight="800" text-anchor="middle" >1</text><text x="106" y="184" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#ECEEF6" font-weight="700" text-anchor="start" >How many bits?</text><text x="60" y="226" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#98A0B8" font-weight="400" text-anchor="start" >Brother chart: count from</text><text x="60" y="248" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#98A0B8" font-weight="400" text-anchor="start" >the right until ≥ needed</text><text x="171" y="308" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="40" fill="#A57BFF" font-weight="800" text-anchor="middle" >2 bits</text><text x="171" y="346" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#ECEEF6" font-weight="600" text-anchor="middle" >2 → 4 ✓</text><line x1="306" y1="258" x2="322" y2="258" stroke="#98A0B8" stroke-width="3" marker-end="url(#a-muted)"/><rect x="326" y="140" width="262" height="236" rx="18" fill="#1D2030" stroke="#FFB020" stroke-width="2" /><circle cx="360" cy="176" r="20" fill="#FFB020"/><text x="360" y="183" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#14161F" font-weight="800" text-anchor="middle" >2</text><text x="392" y="184" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#ECEEF6" font-weight="700" text-anchor="start" >New mask</text><text x="346" y="226" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#98A0B8" font-weight="400" text-anchor="start" >Flip those host bits to 1,</text><text x="346" y="248" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#98A0B8" font-weight="400" text-anchor="start" >add the values</text><text x="457" y="308" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="40" fill="#FFB020" font-weight="800" text-anchor="middle" >/26</text><text x="457" y="346" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#ECEEF6" font-weight="600" text-anchor="middle" >255.255.255.192</text><line x1="592" y1="258" x2="608" y2="258" stroke="#98A0B8" stroke-width="3" marker-end="url(#a-muted)"/><rect x="612" y="140" width="262" height="236" rx="18" fill="#1D2030" stroke="#FF4FA3" stroke-width="2" /><circle cx="646" cy="176" r="20" fill="#FF4FA3"/><text x="646" y="183" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#14161F" font-weight="800" text-anchor="middle" >3</text><text x="678" y="184" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#ECEEF6" font-weight="700" text-anchor="start" >Increment</text><text x="632" y="226" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#98A0B8" font-weight="400" text-anchor="start" >Value above the last 1</text><text x="632" y="248" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#98A0B8" font-weight="400" text-anchor="start" >(or 256 − 192)</text><text x="743" y="308" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="40" fill="#FF4FA3" font-weight="800" text-anchor="middle" >64</text><text x="743" y="346" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#ECEEF6" font-weight="600" text-anchor="middle" >gap between networks</text><line x1="878" y1="258" x2="894" y2="258" stroke="#98A0B8" stroke-width="3" marker-end="url(#a-muted)"/><rect x="898" y="140" width="262" height="236" rx="18" fill="#1D2030" stroke="#2FD08A" stroke-width="2" /><circle cx="932" cy="176" r="20" fill="#2FD08A"/><text x="932" y="183" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#14161F" font-weight="800" text-anchor="middle" >4</text><text x="964" y="184" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#ECEEF6" font-weight="700" text-anchor="start" >Networks</text><text x="918" y="226" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#98A0B8" font-weight="400" text-anchor="start" >Start at 0, keep adding</text><text x="918" y="248" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" fill="#98A0B8" font-weight="400" text-anchor="start" >the increment</text><text x="1029" y="308" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="26" fill="#2FD08A" font-weight="800" text-anchor="middle" >.0 .64 .128 .192</text><text x="1029" y="346" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#ECEEF6" font-weight="600" text-anchor="middle" >62 usable hosts each</text><rect x="40" y="400" width="1120" height="56" rx="28" fill="#1D2030" stroke="#2B3047" stroke-width="2" /><text x="600" y="436" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#ECEEF6" font-weight="600" text-anchor="middle" >Hosts per network = 2^(host bits) − 2   →   2⁶ − 2 = 62</text></svg>